groups:
  - name: infrastructure
    rules:
      - alert: CPUUsageHigh
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "The instance {{ $labels.instance }} has a CPU usage above 80% for more than 5 minutes."
          value: "{{ $value | printf \"%.1f\" }}%"
          dashboard_url: "http://grafana:3000/d/000000012/node-exporter-dashboard?var-instance={{ $labels.instance }}"
          runbook_url: "https://github.com/carvanino/observability-platform/blob/main/runbooks/high-cpu.md"

      - alert: CPUUsageCritical
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Critical CPU usage on {{ $labels.instance }}"
          description: "The instance {{ $labels.instance }} has a CPU usage above 90% for more than 10 minutes."
          value: "{{ $value | printf \"%.1f\" }}%"
          dashboard_url: "http://grafana:3000/d/000000012/node-exporter-dashboard?var-instance={{ $labels.instance }}"
          runbook_url: "https://github.com/carvanino/observability-platform/blob/main/runbooks/high-cpu.md"

      - alert: MemoryUsageHigh
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Memory usage on {{ $labels.instance }}"
          description: "The instance {{ $labels.instance }} has a Memory usage above 80% for more than 5 minutes."
          value: "{{ $value | printf \"%.1f\" }}%"
          dashboard_url: "http://grafana:3000/d/000000012/node-exporter-dashboard?var-instance={{ $labels.instance }}"
          runbook_url: "https://github.com/carvanino/observability-platform/blob/main/runbooks/high-memory.md"

      - alert: MemoryUsageCritical
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 90
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Critical Memory usage on {{ $labels.instance }}"
          description: "The instance {{ $labels.instance }} has a Memory usage above 90% for more than 10 minutes."
          value: "{{ $value | printf \"%.1f\" }}%"
          dashboard_url: "http://grafana:3000/d/000000012/node-exporter-dashboard?var-instance={{ $labels.instance }}"
          runbook_url: "https://github.com/carvanino/observability-platform/blob/main/runbooks/high-memory.md"

      - alert: DiskUsageHigh
        expr: (node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} - node_filesystem_free_bytes{fstype!~"tmpfs|overlay"}) / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} * 100 > 75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Disk usage on {{ $labels.instance }}"
          description: "The instance {{ $labels.instance }} has a Disk usage above 75% for more than 5 minutes."
          value: "{{ $value | printf \"%.1f\" }}%"
          dashboard_url: "http://grafana:3000/d/000000012/node-exporter-dashboard?var-instance={{ $labels.instance }}"
          runbook_url: "https://github.com/carvanino/observability-platform/blob/main/runbooks/high-disk.md"

      - alert: DiskUsageCritical
        expr: (node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} - node_filesystem_free_bytes{fstype!~"tmpfs|overlay"}) / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} * 100 > 90
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Critical Disk usage on {{ $labels.instance }}"
          description: "The instance {{ $labels.instance }} has a Disk usage above 90% for more than 10 minutes."
          value: "{{ $value | printf \"%.1f\" }}%"
          dashboard_url: "http://grafana:3000/d/000000012/node-exporter-dashboard?var-instance={{ $labels.instance }}"
          runbook_url: "https://github.com/carvanino/observability-platform/blob/main/runbooks/high-disk.md"

      - alert: ClinsightDown
        expr: probe_success{job="blackbox"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint {{ $labels.instance }} is down"
          description: "The blackbox exporter has detected that the endpoint {{ $labels.instance }} is not responding to HTTP probes for more than 2 minutes."
          value: "probe_success = {{ $value }}"
          dashboard_url: "http://grafana:3000/d/000000012/node-exporter-dashboard?var-instance={{ $labels.instance }}"
          runbook_url: "https://github.com/carvanino/observability-platform/blob/main/runbooks/server-down.md"
