apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    access: proxy
    uid: prometheus

  - name: Loki
    type: loki
    url: http://loki:3100
    isDefault: false
    access: proxy
    uid: loki
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: "trace_id=(\\w+)"
          url: "${__value.raw}"
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    url: http://tempo:3200
    isDefault: false
    access: proxy
    uid: tempo

  - name: Alertmanager
    type: alertmanager
    url: http://alertmanager:9093
    isDefault: false
    access: proxy
    uid: alertmanager
    