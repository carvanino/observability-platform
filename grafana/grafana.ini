[server]
http_port = 3000
domain = localhost

[security]
admin_user = admin
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}
disable_gravatar = true

[auth.anonymous]
enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/node-exporter.json

[paths]
provisioning = /etc/grafana/provisioning

[alerting]
enabled = false

[unified_alerting]
enabled = false

[log]
mode = console
level = info
